# Self-hosted deployment: signaling server + viewer, plus an optional coturn relay.
#
#   cp ../.env.example ../.env   # then edit TURN_* and TURN_EXTERNAL_IP
#   docker compose -f docker/docker-compose.yml --env-file .env up -d
#
# Put a TLS reverse proxy (Caddy, nginx, Traefik) in front of port 47831 and set TRUST_PROXY=1.
services:
  remotedesk:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "47831:47831"
    environment:
      PORT: "47831"
      TRUST_PROXY: "${TRUST_PROXY:-1}"
      STUN_URLS: "${STUN_URLS:-stun:stun.l.google.com:19302}"
      TURN_URL: "${TURN_URL:-}"
      TURN_USER: "${TURN_USER:-}"
      TURN_PASS: "${TURN_PASS:-}"
      DATA_DIR: /data
    volumes:
      - remotedesk-data:/data

  coturn:
    image: coturn/coturn:latest
    restart: unless-stopped
    # Host networking is the most reliable way to run a TURN relay.
    network_mode: host
    profiles: ["turn"]
    command:
      - "-n"
      - "--log-file=stdout"
      - "--realm=${TURN_REALM:-remotedesk}"
      - "--listening-port=3478"
      - "--fingerprint"
      - "--lt-cred-mech"
      - "--user=${TURN_USER:-remotedesk}:${TURN_PASS:?set TURN_PASS}"
      - "--external-ip=${TURN_EXTERNAL_IP:?set TURN_EXTERNAL_IP}"
      - "--min-port=49160"
      - "--max-port=49200"
      - "--no-cli"
      - "--no-tls"
      - "--no-dtls"

volumes:
  remotedesk-data:
